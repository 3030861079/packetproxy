name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-pip build-essential git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev binutils libltdl-dev
          pip3 install --upgrade pip -q
          pip3 install buildozer cython -q

      - name: Clone p4a and pin hostpython to 3.10.13
        run: |
          git clone --depth 1 https://github.com/kivy/python-for-android.git /tmp/p4a
          HP=$(find /tmp/p4a/pythonforandroid/recipes -name "hostpython3" -type d)
          RECIPE="$HP/__init__.py"
          echo "Recipe: $RECIPE"
          echo "Before:"
          grep -E "version|url" "$RECIPE" | head -3
          # Pin to Python 3.10.13 (has cgi, Cython needs it)
          sed -i 's|version\s*=.*|version = "3.10.13"|' "$RECIPE"
          sed -i 's|url\s*=.*|url = "https://www.python.org/ftp/python/{version}/Python-{version}.tar.xz"|' "$RECIPE"
          echo "After:"
          grep -E "version|url" "$RECIPE" | head -3
          # Add p4a.source_dir to buildozer.spec so buildozer uses our p4a
          echo "p4a.source_dir = /tmp/p4a" >> buildozer.spec

      - name: Build APK
        run: yes | buildozer -v android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PacketProxy-APK
          path: bin/*.apk
          retention-days: 30
