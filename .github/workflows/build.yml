name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip git zip unzip openjdk-17-jdk autoconf libtool zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev
          pip3 install --upgrade pip -q && pip3 install buildozer cython -q

      - name: Clone p4a and pin hostpython to 3.10.13
        run: |
          git clone --depth 1 https://github.com/kivy/python-for-android.git /tmp/p4a
          python3 patches/pin_hostpython.py /tmp/p4a
          echo "p4a.source_dir = /tmp/p4a" >> buildozer.spec

      - name: Build APK (single pass)
        run: yes | buildozer -v android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PacketProxy-APK
          path: bin/*.apk
          retention-days: 30
