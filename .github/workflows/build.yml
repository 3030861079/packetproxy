name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip build-essential git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev binutils libltdl-dev
          pip3 install --upgrade pip -q
          pip3 install buildozer cython -q

      - name: Clone p4a at known-good commit (hostpython=3.10)
        run: |
          git clone --depth 1 --branch v2024.01.21 https://github.com/kivy/python-for-android.git /tmp/p4a 2>&1 || \
          git clone https://github.com/kivy/python-for-android.git /tmp/p4a && cd /tmp/p4a && git checkout 33c2f28 2>&1 || true
          echo "p4a version:"
          cd /tmp/p4a && git log --oneline -1
          echo "hostpython recipe version:"
          grep version /tmp/p4a/pythonforandroid/recipes/hostpython3/__init__.py 2>/dev/null | head -1 || echo "not found"
          echo "p4a.source_dir = /tmp/p4a" >> buildozer.spec

      - name: Build APK
        run: yes | buildozer -v android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PacketProxy-APK
          path: bin/*.apk
          retention-days: 30
