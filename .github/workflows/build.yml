name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-pip python3-dev build-essential \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev binutils libltdl-dev
          python3 -m pip install --upgrade pip -q
          python3 -m pip install buildozer cython -q

      - name: Init buildozer (downloads p4a, sets up SDK)
        run: yes | buildozer -v android debug || true

      - name: Pin hostpython3 to 3.10.13 (Python 3.14 removed cgi, breaks Cython)
        run: |
          RECIPE=$(find .buildozer -path "*/recipes/hostpython3/__init__.py" -type f 2>/dev/null | head -1)
          if [ -z "$RECIPE" ]; then
            echo "ERROR: hostpython3 recipe not found"
            find .buildozer -name "hostpython3" -type d 2>/dev/null
            exit 0
          fi
          echo "Found: $RECIPE"
          # Check if already at 3.10
          CURRENT=$(grep 'version\s*=' "$RECIPE" | head -1)
          echo "Current: $CURRENT"
          if echo "$CURRENT" | grep -q "3.10"; then
            echo "Already Python 3.10, no change needed"
          else
            echo "Pinning to Python 3.10.13..."
            sed -i 's/version\s*=.*/version = "3.10.13"/' "$RECIPE"
            sed -i 's|url\s*=.*|url = "https://www.python.org/ftp/python/{version}/Python-{version}.tar.xz"|' "$RECIPE"
            echo "Patched recipe:"
            grep -E 'version|url' "$RECIPE" | head -5
            # Remove old hostpython build artifacts so it rebuilds
            HOSTPYDIR=$(find .buildozer -path "*/build/other_builds/hostpython3" -type d 2>/dev/null | head -1)
            if [ -n "$HOSTPYDIR" ]; then
              echo "Removing old hostpython build: $HOSTPYDIR"
              rm -rf "$HOSTPYDIR"
            fi
          fi

      - name: Build APK (retry with Python 3.10 hostpython)
        run: buildozer -v android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PacketProxy-APK
          path: bin/*.apk
          retention-days: 30
