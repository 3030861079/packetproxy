name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-pip python3-dev build-essential \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev binutils libltdl-dev
          python3 -m pip install --upgrade pip -q
          python3 -m pip install buildozer cython -q

      - name: Init buildozer (downloads SDK, builds hostpython)
        run: yes | buildozer -v android debug || true

      - name: Inject cgi.py into hostpython3 stdlib
        run: |
          # Find the built hostpython3 binary
          HP=$(find .buildozer -path "*/hostpython3/*/python" -type f 2>/dev/null | head -1)
          if [ -z "$HP" ]; then
            echo "hostpython3 binary not found, searching..."
            find .buildozer -name "hostpython3" -type d 2>/dev/null
            find .buildozer -path "*hostpython*" -name "python" 2>/dev/null
            exit 0
          fi
          echo "hostpython3 binary: $HP"
          $HP --version

          # Get its stdlib path
          STDLIB=$($HP -c "import sysconfig; print(sysconfig.get_path('stdlib'))")
          echo "stdlib: $STDLIB"

          if [ ! -d "$STDLIB" ]; then
            echo "stdlib not found at $STDLIB"
            exit 1
          fi

          # Inject cgi.py from our stub
          cp cgi_stub.py "$STDLIB/cgi.py"
          echo "=== Patched cgi.py into stdlib ==="
          $HP -c "import cgi; print('cgi OK, escape:', cgi.escape('<test>'))"

          # Also for safety: remove hostpython build marker so p4a might rebuild
          HP_BUILD=$(dirname $(dirname "$HP"))
          echo "Hostpython build dir: $HP_BUILD"
          ls "$HP_BUILD" 2>/dev/null | head -5

      - name: Build APK (second pass)
        run: buildozer -v android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PacketProxy-APK
          path: bin/*.apk
          retention-days: 30
