
plugins {
    id("com.android.application")
}

android {
    namespace "org.packetproxy"
    compileSdk 31

    defaultConfig {
        applicationId "org.packetproxy"
        minSdk 21
        targetSdk 31
        versionCode 1
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation "androidx.core:core:1.9.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
}
